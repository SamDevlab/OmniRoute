name: Governor Harness

on:
  pull_request:
    branches: ["release/**"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/ad-hoc/omniroute-governor-*.mjs"
      - "scripts/ad-hoc/omniroute-shadow-benchmark-core.mjs"
      - "tests/unit/omniroute-governor-*.test.ts"
      - "tests/unit/omniroute-shadow-benchmark-methodology.test.ts"
      - "open-sse/governor/**"
      - "open-sse/services/combo/**"
      - "open-sse/services/autoCombo/**"
      - "open-sse/services/model.ts"
      - "src/shared/utils/featureFlags.ts"
      - "src/shared/constants/featureFlagDefinitions.ts"
      - "scripts/quality/classify-pr-changes.mjs"
      - "tests/unit/classify-pr-changes.test.ts"
      - ".github/workflows/governor-harness.yml"
  workflow_dispatch:

concurrency:
  group: governor-harness-${{ github.ref }}
  cancel-in-progress: true

# Temporary write scope is used only by the idempotent finalization step below on the
# internal Governor branch. It is removed again after the branch hardening lands.
permissions:
  contents: write

env:
  CI_NODE_VERSION: "24"
  OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
  JWT_SECRET: ci-governor-harness-secret-with-sufficient-length
  API_KEY_SECRET: ci-governor-harness-api-secret-with-sufficient-length
  DISABLE_SQLITE_AUTO_BACKUP: "true"
  INTELLIGENCE_GOVERNOR_MODE: "off"
  INTELLIGENCE_GOVERNOR_TELEMETRY: "false"
  GOVERNOR_ACTIVE_ENABLED: "false"
  GOVERNOR_ACTIVE_CANARY_RATE: "0"

jobs:
  focused:
    name: Governor Harness Tests
    # Intentionally no draft-PR guard. The tracking Governor PR stays draft during validation,
    # and skipping these tests on drafts allowed diagnostic regressions to reach live benchmarks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Finalize authoritative harness invariants
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/s3-intelligence-governor-prework-20260810' }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ad-hoc/omniroute-governor-divergence-e2e-20260819.mjs")
          text = path.read_text(encoding="utf-8")

          def replace_between(source, start_marker, end_marker, replacement):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + replacement + source[end:]

          old_identity = '''  const targetIdentity =
            targetMatch === "MISMATCH" || connectionIdentity === "MISMATCH"
              ? "MISMATCH"
              : targetMatch === "UNKNOWN"
                ? "UNKNOWN"
                : "PASS";'''
          new_identity = '''  const targetIdentity =
            targetMatch === "MISMATCH" || connectionIdentity === "MISMATCH"
              ? "MISMATCH"
              : targetMatch === "PASS" && connectionIdentity === "PASS"
                ? "PASS"
                : "UNKNOWN";'''
          if old_identity in text:
              text = text.replace(old_identity, new_identity, 1)
          elif new_identity not in text:
              raise SystemExit("target identity invariant not recognized")

          if "const targets = pool.targets.filter((item) => targetFromResolved(item).key === key);" not in text:
              revalidate = r'''async function revalidateTarget(pool, provider, model) {
            const key = normalizeTarget(provider, model);
            const targets = pool.targets.filter((item) => targetFromResolved(item).key === key);
            const candidates = pool.candidates.filter((item) => candidateKey(item) === key);
            if (targets.length === 0 || candidates.length === 0) {
              return { valid: false, reason: "target_not_in_current_pool" };
            }

            const breaker = getCircuitBreaker(provider).getStatus();
            const connectionIds = [
              ...new Set(
                targets.flatMap((target) => [
                  target.connectionId,
                  ...(Array.isArray(target.allowedConnectionIds) ? target.allowedConnectionIds : []),
                ])
              ),
            ].filter((id) => typeof id === "string" && id !== "noauth");
            const hasSyntheticNoauth = targets.some(
              (target) =>
                target.connectionId === "noauth" ||
                (Array.isArray(target.allowedConnectionIds) &&
                  target.allowedConnectionIds.includes("noauth"))
            );
            const connectionChecks = connectionIds.map((connectionId) => {
              const connection = pool.connectionState?.get(connectionId) || null;
              const rateLimitedUntil = connection?.rateLimitedUntil
                ? new Date(connection.rateLimitedUntil).getTime()
                : 0;
              const cooldownActive =
                Number.isFinite(rateLimitedUntil) && rateLimitedUntil > Date.now();
              const unavailableStatus = [
                "unavailable",
                "banned",
                "expired",
                "credits_exhausted",
              ].includes(connection?.testStatus);
              const modelLocked = Boolean(getModelLockoutInfo(provider, connectionId, model));
              return {
                connectionId,
                connection,
                cooldownActive,
                unavailableStatus,
                modelLocked,
                available:
                  connection?.active === true &&
                  !cooldownActive &&
                  !unavailableStatus &&
                  !modelLocked,
              };
            });
            const modelLockout =
              connectionChecks.length > 0 && connectionChecks.every((check) => check.modelLocked);
            const connectionEligible =
              hasSyntheticNoauth || connectionChecks.some((check) => check.available);
            const cooldownActive =
              connectionChecks.length > 0 &&
              connectionChecks.every((check) => check.cooldownActive);
            const unavailableStatus =
              connectionChecks.length > 0 &&
              connectionChecks.every((check) => check.unavailableStatus);
            const candidateEligible = candidates.some(
              (candidate) => candidate.quotaCutoffBlocked !== true
            );
            const candidateHealthy = candidates.some(
              (candidate) =>
                candidate.circuitBreakerState !== "OPEN" && candidate.statusPenalty !== true
            );
            const guardrails = {
              active: true,
              eligible: candidateEligible,
              healthy: breaker.state !== "OPEN" && candidateHealthy,
              notCooldown: hasSyntheticNoauth || !cooldownActive,
              notLocked: hasSyntheticNoauth || !modelLockout,
              notExhausted: hasSyntheticNoauth || !unavailableStatus,
              circuitAllowed: breaker.state !== "OPEN",
            };
            const valid = Object.values(guardrails).every(Boolean) && connectionEligible;
            return {
              valid,
              providerCircuitState: breaker.state,
              targetCount: targets.length,
              candidateCount: candidates.length,
              connectionState:
                connectionChecks.length > 0
                  ? connectionChecks.map(
                      ({
                        connectionId,
                        connection,
                        cooldownActive,
                        unavailableStatus,
                        modelLocked,
                      }) => ({
                        connectionId,
                        active: connection?.active === true,
                        testStatus: connection?.testStatus || null,
                        cooldownActive,
                        unavailableStatus,
                        modelLocked,
                      })
                    )
                  : hasSyntheticNoauth
                    ? "synthetic-noauth"
                    : "unreported",
              cooldownActive,
              unavailableStatus,
              modelLockout,
              connectionEligible,
              hasSyntheticNoauth,
              guardrails,
              reason: valid ? null : "stale_or_ineligible_target",
            };
          }

          '''
              text = replace_between(
                  text,
                  "async function revalidateTarget(pool, provider, model) {",
                  "function planTarget(plan) {",
                  revalidate,
              )

          if "const accountingPass =" not in text:
              gate = r'''function gateForFivePairs(pairs) {
            const native = authoritativeArmAggregate(pairs, "native");
            const governor = authoritativeArmAggregate(pairs, "governor");
            const accounting = authoritativeAccounting(pairs);
            const failureClasses = [
              ...pairs.flatMap((pair) => [
                pair.native?.failureClass,
                pair.governor?.failureClass,
                pair.failureClass,
              ]),
            ].filter(Boolean);
            const invalid = pairs.filter((pair) => pair.invalid === true).length;
            const correlationPass =
              pairs.length === 5 &&
              pairs.every(
                (pair) =>
                  Boolean(pair.native?.request?.correlationId) &&
                  Boolean(pair.governor?.direct?.correlationId)
              );
            const identityPass =
              pairs.length === 5 &&
              pairs.every(
                (pair) =>
                  pair.native?.targetIdentity === "PASS" &&
                  pair.governor?.targetIdentity === "PASS"
              );
            // A real MODEL_QUALITY_FAILURE is a measured experimental outcome, not a methodology failure.
            // Require both validators to have produced boolean measurements, but do not require them true.
            const qualityMeasured =
              pairs.length === 5 &&
              pairs.every(
                (pair) =>
                  typeof pair.native?.request?.qualityPass === "boolean" &&
                  typeof pair.governor?.direct?.qualityPass === "boolean"
              );
            const artifactIntegrity =
              pairs.length === 5 &&
              pairs.every(
                (pair) =>
                  Boolean(pair.nativeOperationId || pair.native?.nativeOperationId) &&
                  Boolean(pair.governorPlanOperationId || pair.governor?.governorPlanOperationId) &&
                  Boolean(pair.governorOperationId || pair.governor?.governorOperationId) &&
                  Boolean(pair.pairCompleteOperationId)
              );
            const accountingPass =
              pairs.length === 5 &&
              accounting.nativeRequests === 5 &&
              accounting.governorPlanningOperations === 5 &&
              accounting.governorExecutionRequests === 5 &&
              accounting.physicalRequests === 10;
            const forbiddenFailures = failureClasses.filter((failureClass) =>
              [
                "HARNESS_FAILURE",
                "VALIDATOR_FAILURE",
                "TARGET_MISMATCH",
                "STALE_PLAN",
                "SYSTEMIC_RUNTIME_FAILURE",
              ].includes(failureClass)
            );
            const pass =
              pairs.length === 5 &&
              native.http === 5 &&
              native.stream === 5 &&
              governor.plans === 5 &&
              governor.executable === 5 &&
              governor.http === 5 &&
              governor.stream === 5 &&
              accountingPass &&
              correlationPass &&
              identityPass &&
              qualityMeasured &&
              artifactIntegrity &&
              invalid === 0 &&
              forbiddenFailures.length === 0;
            return {
              pass,
              pairsRequested: 5,
              pairsStarted: pairs.length,
              pairsCompleted: pairs.length,
              pairsValid: pairs.filter((pair) => pair.invalid !== true).length,
              pairs: pairs.length,
              nativeHttp: native.http,
              nativeStreams: native.stream,
              governorPlans: governor.plans,
              governorExecutable: governor.executable,
              governorHttp: governor.http,
              governorStreams: governor.stream,
              nativeQuality: native.quality,
              governorQuality: governor.quality,
              quality: qualityMeasured ? "MEASURED" : "UNMEASURED",
              qualityMeasured,
              qualityIsMethodologyGate: false,
              accounting: accountingPass ? "PASS" : "FAIL",
              identity: identityPass ? "PASS" : "FAIL",
              correlation: correlationPass ? "PASS" : "FAIL",
              artifactIntegrity: artifactIntegrity ? "PASS" : "FAIL",
              benchmarkInvalid: forbiddenFailures.length > 0,
              invalid,
              failureClasses,
              forbiddenFailures,
            };
          }

          '''
              text = replace_between(
                  text,
                  "function gateForFivePairs(pairs) {",
                  "function authoritativePairwise(pairs) {",
                  gate,
              )

          if "const latencyComparablePairs =" not in text:
              conclusion = r'''function authoritativeConclusion(pairs, aggregates, pairwise) {
            const validPairs = pairs.filter((pair) => !pair.invalid);
            if (validPairs.length === 0) return "E2E_INCONCLUSIVE";
            const nativeQuality = aggregates.native.quality;
            const governorQuality = aggregates.governor.quality;
            if (governorQuality < nativeQuality) return "NATIVE_E2E_BETTER";
            if (nativeQuality < governorQuality) return "GOVERNOR_E2E_BETTER";

            // Once aggregate quality is tied, latency may decide only on pairs where both
            // arms passed quality/reliability and produced a complete total-E2E measurement.
            const latencyComparablePairs = validPairs.filter(
              (pair) =>
                pair.native?.request?.qualityPass === true &&
                pair.governor?.direct?.qualityPass === true &&
                pair.native?.request?.status === 200 &&
                pair.governor?.direct?.status === 200 &&
                pair.native?.request?.streamCompleted === true &&
                pair.governor?.direct?.streamCompleted === true &&
                Number.isFinite(pair.native?.e2eCompletionMs) &&
                Number.isFinite(pair.governor?.e2eCompletionMs)
            );
            if (latencyComparablePairs.length === 0) return "E2E_INCONCLUSIVE";
            if (pairwise.nativeLatencyWins > pairwise.governorLatencyWins) {
              return "NATIVE_E2E_BETTER";
            }
            if (pairwise.governorLatencyWins > pairwise.nativeLatencyWins) {
              return "GOVERNOR_E2E_BETTER";
            }
            return "E2E_ROUGHLY_EQUIVALENT";
          }

          '''
              text = replace_between(
                  text,
                  "function authoritativeConclusion(pairs, aggregates, pairwise) {",
                  "function calibrationRecoverySummary(pairs) {",
                  conclusion,
              )

          path.write_text(text, encoding="utf-8")
          PY

          node --check scripts/ad-hoc/omniroute-governor-divergence-e2e-20260819.mjs
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- scripts/ad-hoc/omniroute-governor-divergence-e2e-20260819.mjs
            git commit -m "fix(test): finish authoritative benchmark hardening"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      # Use the repository's hardened retry wrapper. The harness lane initially used bare
      # `npm ci` and false-red on an onnxruntime-node binary download timeout before tests ran.
      - uses: ./.github/actions/npm-ci-retry

      - name: Diagnostic script syntax
        run: |
          node --check scripts/ad-hoc/omniroute-governor-target-identity.mjs
          node --check scripts/ad-hoc/omniroute-governor-native-baseline-worker.mjs
          node --check scripts/ad-hoc/omniroute-governor-native-baseline.mjs
          node --check scripts/ad-hoc/omniroute-governor-pair-state.mjs
          node --check scripts/ad-hoc/omniroute-governor-benchmark-persistence.mjs
          node --check scripts/ad-hoc/omniroute-governor-run-summarizer.mjs
          node --check scripts/ad-hoc/omniroute-governor-divergence-e2e-20260819.mjs

      - name: Governor benchmark and safety regression tests
        run: |
          node \
            --import tsx/esm \
            --import ./open-sse/utils/setupPolyfill.ts \
            --import ./tests/_setup/isolateDataDir.ts \
            --test \
            --test-force-exit \
            --test-concurrency=4 \
            tests/unit/classify-pr-changes.test.ts \
            tests/unit/omniroute-governor-target-identity.test.ts \
            tests/unit/omniroute-governor-native-baseline.test.ts \
            tests/unit/omniroute-governor-authoritative-gate-contract.test.ts \
            tests/unit/omniroute-governor-divergence-e2e-harness.test.ts \
            tests/unit/omniroute-governor-incomplete-pair-harness.test.ts \
            tests/unit/omniroute-shadow-benchmark-methodology.test.ts \
            tests/unit/governor/governor-feature-flags-and-failures.test.ts \
            tests/unit/governor/governor-shadow-isolation.test.ts \
            tests/unit/governor/governor-telemetry-privacy.test.ts \
            tests/unit/governor/runtime-closure.test.ts \
            tests/unit/governor/simulate-feature-flag.test.ts \
            tests/unit/governor/counterfactual-telemetry.test.ts \
            tests/unit/governor/stream-observability.test.ts

      - name: Formatting and diff-safe syntax
        run: |
          npx prettier --check \
            scripts/ad-hoc/omniroute-governor-target-identity.mjs \
            scripts/ad-hoc/omniroute-governor-native-baseline-worker.mjs \
            scripts/ad-hoc/omniroute-governor-divergence-e2e-20260819.mjs \
            scripts/quality/classify-pr-changes.mjs \
            tests/unit/classify-pr-changes.test.ts \
            tests/unit/omniroute-governor-target-identity.test.ts \
            tests/unit/omniroute-governor-native-baseline.test.ts \
            tests/unit/omniroute-governor-authoritative-gate-contract.test.ts \
            .github/workflows/governor-harness.yml
