name: Build App

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  # Temporary write scope for one idempotent correction on the internal Governor branch.
  # Restored to read-only immediately after the source commit lands.
  contents: write

jobs:
  build:
    name: Fast Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Expand Virtual Memory (Native 10GB Swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply Governor TS2448 source fix
        if: ${{ github.ref_name == 'feature/s3-intelligence-governor-prework-20260810' }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sse/handlers/chat.ts")
          text = path.read_text(encoding="utf-8")
          declaration = '      const errorStr = String(result.rawMessage ?? result.error ?? "");\n'
          anchor = '''      if (!result.success && typeof result.rawMessage === "string") {
            attachInternalRawErrorMessage(result.response, result.rawMessage);
          }
'''
          fixed = anchor + declaration

          if fixed in text:
              print("TS2448 declaration order already fixed")
          else:
              if text.count(declaration) != 1:
                  raise SystemExit(f"expected one errorStr declaration, found {text.count(declaration)}")
              if text.count(anchor) != 1:
                  raise SystemExit(f"expected one upstream-result anchor, found {text.count(anchor)}")
              text = text.replace(declaration, "", 1)
              text = text.replace(anchor, fixed, 1)
              path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          if ! git diff --quiet -- src/sse/handlers/chat.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- src/sse/handlers/chat.ts
            git commit -m "fix(chat): define raw error text before account fallback"
            git push origin HEAD:feature/s3-intelligence-governor-prework-20260810
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app & CLI bundle
        run: |
          npm run build:release
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          OMNIROUTE_BUILD_MEMORY_MB: "12288"
          OMNIROUTE_USE_TURBOPACK: "1"

      - name: Archive build outputs
        run: |
          tar -czf omniroute-build.tar.gz .build dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-build
          path: omniroute-build.tar.gz
          retention-days: 7
